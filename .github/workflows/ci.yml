name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Full audit (informational)
        continue-on-error: true
        run: npm audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

  # One stable check name for the branch ruleset to require. Matrix legs rename themselves when the
  # matrix changes and a skipped leg leaves a PR waiting forever, so the ruleset points at this job
  # only. It fails unless every build leg succeeded.
  gate:
    name: gate
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.build.result }}
    steps:
      - run: |
          echo "build=$BUILD"
          test "$BUILD" = success
