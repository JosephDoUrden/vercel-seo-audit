# Temporary: proves the pull_request comment path on this PR. Removed before merge.
name: action-e2e
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          url: https://yusufhan.dev
          pr-comment: true
          comment-key: e2e
