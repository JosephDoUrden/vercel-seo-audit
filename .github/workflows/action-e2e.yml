# Temporary: proves the pull_request comment path on this PR. Removed before merge.
# The action is checked out into a subdirectory so the workspace root holds no
# package.json: inside its own checkout npm treats the same-named project as
# already present and runs no bin.
name: action-e2e
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: action-src
      - uses: ./action-src
        with:
          url: https://yusufhan.dev
          pr-comment: true
          comment-key: e2e
