# Temporary: proves the pull_request comment path on this PR. Removed before merge.
name: action-e2e
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The action runs inside its own checkout here, so npx resolves the local package;
      # build it so the branch's own CLI (not the published one) is what runs.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: ./
        with:
          url: https://yusufhan.dev
          pr-comment: true
          comment-key: e2e
