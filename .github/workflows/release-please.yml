name: Release Please

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    # Runs after a release, or by hand when a release exists on npm's side but the publish failed.
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      # No token: npm authenticates the job through GitHub's OIDC token (trusted publisher set on
      # npmjs.com for this repo and workflow file). Provenance is attached automatically.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "vercel-seo-audit@${VERSION}" version >/dev/null 2>&1; then
            echo "::warning::v${VERSION} already published, skipping."
          else
            npm publish --provenance --access public
          fi

  # The Marketplace example says `uses: JosephDoUrden/vercel-seo-audit@v1`. That tag only means
  # something if it follows releases, so after every publish the v<major> tag is moved to the
  # release commit. Moved through the API, so it is a plain tag, not a signed one, same as the
  # major tags on actions/checkout and friends.
  move-major-tag:
    needs: [release-please, publish]
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point v<major> at this release
        run: |
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          TAG="v${MAJOR}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" -f sha="${SHA}" -F force=true >/dev/null
            echo "moved ${TAG} to ${SHA}"
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" >/dev/null
            echo "created ${TAG} at ${SHA}"
          fi
