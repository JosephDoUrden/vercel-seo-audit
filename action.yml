name: 'Vercel SEO Audit'
description: 'Diagnose SEO and indexing issues for Next.js/Vercel websites'
author: 'Yusufhan Sacak'
branding:
  icon: 'search'
  color: 'blue'

inputs:
  url:
    description: 'URL to audit (e.g. https://yusufhan.dev)'
    required: true
  strict:
    description: 'Fail on warnings too (exit code 1)'
    required: false
    default: 'false'
  user-agent:
    description: 'User-Agent preset (googlebot, bingbot) or custom string'
    required: false
  pages:
    description: 'Comma-separated page paths to check (e.g. /docs,/team)'
    required: false
  report:
    description: 'Write report to file: json or md'
    required: false
  timeout:
    description: 'Request timeout in milliseconds'
    required: false
    default: '10000'
  verbose:
    description: 'Show detailed information for each finding'
    required: false
    default: 'false'

outputs:
  exit-code:
    description: 'Audit exit code (0 = pass, 1 = errors found, 2 = crash)'
    value: ${{ steps.audit.outputs.exit-code }}
  report-path:
    description: 'Path to report file (if --report was used)'
    value: ${{ steps.audit.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20

    - name: Run SEO Audit
      id: audit
      shell: bash
      # Inputs go through env, not ${{ }} inside run, so a hostile value
      # (PR title, branch name, dispatch input) cannot break out of the script.
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_USER_AGENT: ${{ inputs.user-agent }}
        INPUT_PAGES: ${{ inputs.pages }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        args=()

        if [ "$INPUT_STRICT" = "true" ]; then
          args+=(--strict)
        fi

        if [ -n "$INPUT_USER_AGENT" ]; then
          args+=(--user-agent "$INPUT_USER_AGENT")
        fi

        if [ -n "$INPUT_PAGES" ]; then
          args+=(--pages "$INPUT_PAGES")
        fi

        if [ -n "$INPUT_REPORT" ]; then
          args+=(--report "$INPUT_REPORT")
        fi

        if [ -n "$INPUT_TIMEOUT" ] && [ "$INPUT_TIMEOUT" != "10000" ]; then
          args+=(--timeout "$INPUT_TIMEOUT")
        fi

        if [ "$INPUT_VERBOSE" = "true" ]; then
          args+=(--verbose)
        fi

        # "--" ends option parsing, so a url starting with "-" is a url, not a flag.
        # An empty url sends nothing, the CLI then reads it from .seoauditrc.json or errors.
        target=()
        if [ -n "$INPUT_URL" ]; then
          target=(-- "$INPUT_URL")
        fi
        set +e
        npx vercel-seo-audit@2.6.0 "${args[@]}" "${target[@]}" # x-release-please-version
        EXIT_CODE=$?
        set -e

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        # Only report a path for a file the audit actually wrote.
        if [ "$INPUT_REPORT" = "json" ] && [ -f report.json ]; then
          echo "report-path=report.json" >> "$GITHUB_OUTPUT"
        elif [ "$INPUT_REPORT" = "md" ] && [ -f report.md ]; then
          echo "report-path=report.md" >> "$GITHUB_OUTPUT"
        fi

        exit "$EXIT_CODE"
